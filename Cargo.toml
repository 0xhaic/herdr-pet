[package]
name = "herdr-pet"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
muda = "0.21.2"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tray-icon = "0.26.1"
wgpu = "30.0.2"
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSEvent",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSBundle",
    "NSString",
    "NSUserNotification",
] }
