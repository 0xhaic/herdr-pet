[package]
name = "herdr-pet"
version = "0.1.19"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
muda = "0.21.2"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
tray-icon = "0.26.1"
wgpu = "30.0.2"
winit = "0.30.13"

[target.'cfg(target_os = "windows")'.dependencies]
resvg = { version = "0.50.0", default-features = false }
windows-numerics = "0.3.1"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", features = ["alloc"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAlert",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSOpenPanel",
    "NSPanel",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSSavePanel",
    "NSScreen",
    "NSSlider",
    "NSResponder",
    "NSRunningApplication",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSBundle",
    "NSData",
    "NSString",
    "NSUserNotification",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
] }
