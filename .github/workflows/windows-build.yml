name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # 功能分支在 Windows 上做里程碑验证，产出可下载的 exe。
      - "feat/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cp target/release/herdr-pet.exe "dist/herdr-pet-${version}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-pet-windows-x64
          path: dist/*.exe
