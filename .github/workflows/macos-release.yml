name: macOS package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 必须在任何 cargo 命令之前读取：cargo 会自动改写 Cargo.lock 的版本。
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          lock_version=$(sed -n '/^name = "herdr-pet"$/{n;s/^version = "\(.*\)"/\1/p;}' Cargo.lock)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$manifest_version" ] || [ "$manifest_version" != "$lock_version" ]; then
            echo "version mismatch: tag=$GITHUB_REF_NAME Cargo.toml=$manifest_version Cargo.lock=$lock_version" >&2
            exit 1
          fi

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "missing release notes: $notes" >&2
            exit 1
          fi

      - name: Add arm64 target
        run: rustup target add aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Bundle .app
        run: scripts/bundle.sh aarch64-apple-darwin

      - name: Verify bundle
        run: |
          file dist/herdr-pet.app/Contents/MacOS/herdr-pet
          codesign -dv dist/herdr-pet.app

      - name: DMG
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          hdiutil create -volname "herdr-pet" -srcfolder dist/herdr-pet.app \
            -ov -format UDZO "dist/herdr-pet-${version}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-pet-macos-arm64
          path: dist/*.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/release-notes/$tag.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
            gh release upload "$tag" dist/*.dmg --clobber
          else
            gh release create "$tag" dist/*.dmg --title "$tag" --notes-file "$notes"
          fi
